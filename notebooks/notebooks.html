<style>
/* =========================================================
   palette — falls back to the site tokens when style.css
   defines them, otherwise uses the values from the design
   ========================================================= */
.nb-page{
  --nb-teal:      var(--teal-deep,  #2f5d4f);
  --nb-teal-pale: var(--teal-pale,  #dfe9df);
  --nb-cream:     var(--cream,      #f6efe4);
  --nb-paper:     var(--paper,      #fffdf9);
  --nb-gold:      var(--gold,       #d9b787);
  --nb-sand:      #e8d7be;
  --nb-blush:     #f3e6e2;
  --nb-ink:       var(--ink,        #34302b);
  --nb-ink-soft:  var(--ink-soft,   #6d675f);
  --nb-accent:    var(--coral-deep, #8a6a45);
  --nb-shadow:    var(--shadow,     47,93,79);
  --nb-ease:      var(--ease, cubic-bezier(.22,.68,.36,1));
  --nb-maxw:      var(--maxw, 1240px);
}

/* ---------- page shell ---------- */
.nb-page{
  position:relative; min-height:100vh; overflow-x:clip; padding-bottom:70px;
  font-family:'Cairo', system-ui, sans-serif;
  color:var(--nb-ink);
  background:radial-gradient(circle at 0% 90%, rgba(111, 157, 146, .22), transparent 45%), radial-gradient(circle at 82% 80%, rgba(207, 152, 120, .22), transparent 45%), var(--nb-cream);
}

/* ---------- top bar : brand (right) · filter (center) · back (left) ---------- */
.nb-topbar{
  display:grid; grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center; gap:16px;
  max-width:var(--nb-maxw); margin:0 auto; padding:20px 22px 0;
  position:relative; z-index:5;
}
.nb-brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
.nb-brand-badge{
  width:52px; height:52px; border-radius:50%; background:var(--nb-paper);
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--nb-teal-pale);
  box-shadow:0 8px 20px rgba(var(--nb-shadow),.18);
}
.nb-brand-badge img{ width:30px; height:30px; object-fit:contain; }
.nb-brand span{ font-family:'Aref Ruqaa', serif; font-size:1.05rem; color:var(--nb-teal); }

.nb-filter{
  position:relative; justify-self:center; width:min(100%, 520px);
}
.nb-filter-trigger{
  width:100%; display:flex; align-items:center; gap:12px;
  background:var(--nb-paper); border:none; border-radius:100px; padding:14px 24px;
  box-shadow:0 12px 30px -16px rgba(var(--nb-shadow),.4);
  font-family:inherit; cursor:pointer; text-align:start;
  transition:box-shadow .25s var(--nb-ease);
}
.nb-filter-trigger:hover{ box-shadow:0 16px 34px -14px rgba(var(--nb-shadow),.5); }
.nb-filter-trigger[aria-expanded="true"]{ box-shadow:0 16px 34px -14px rgba(var(--nb-shadow),.55); }
.nb-filter-trigger:focus-visible{ outline:2px solid var(--nb-teal); outline-offset:3px; }
.nb-filter .ico{ flex:none; width:19px; height:19px; color:var(--nb-accent); pointer-events:none; }
.nb-filter-label{
  flex:1; min-width:0; font-size:1rem; font-weight:700; color:var(--nb-ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none;
}
.nb-filter .chev{
  flex:none; width:16px; height:16px; color:var(--nb-ink-soft); pointer-events:none;
  transition:transform .25s var(--nb-ease);
}
.nb-filter-trigger[aria-expanded="true"] .chev{ transform:rotate(180deg); }

.nb-filter-menu{
  position:absolute; top:calc(100% + 10px); inset-inline:0; z-index:20;
  list-style:none; margin:0; padding:9px;
  max-height:min(60vh, 340px); overflow-y:auto;
  background:var(--nb-paper); border-radius:24px;
  box-shadow:0 26px 54px -18px rgba(var(--nb-shadow),.5);
  opacity:0; visibility:hidden; transform:translateY(-8px) scale(.98);
  transform-origin:top center;
  transition:opacity .22s var(--nb-ease), transform .22s var(--nb-ease), visibility .22s;
}
.nb-filter-menu.open{ opacity:1; visibility:visible; transform:translateY(0) scale(1); }
.nb-filter-menu li{
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; border-radius:15px;
  font-size:.97rem; font-weight:600; color:var(--nb-ink-soft);
  cursor:pointer; transition:background .16s, color .16s;
}
.nb-filter-menu li:hover,
.nb-filter-menu li.focused{ background:var(--nb-teal-pale); color:var(--nb-teal); }
.nb-filter-menu li.selected{ color:var(--nb-teal); font-weight:800; }
.nb-filter-menu li.selected::after{
  content:""; margin-inline-start:auto; flex:none;
  width:7px; height:7px; border-radius:50%; background:var(--nb-gold);
}

.nb-back{
  width:52px; height:52px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--nb-teal); color:var(--nb-cream);
  box-shadow:0 12px 24px -10px rgba(var(--nb-shadow),.5);
  transition:transform .3s var(--nb-ease);
  margin-right: 180px;
}
.nb-back:hover{ transform:scale(1.07); }
.nb-back svg{ width:21px; height:21px; }

/* ---------- thumbnail strip : white pill, arrows at both ends ---------- */
.nb-strip-wrap{
  max-width:var(--nb-maxw); margin:26px auto 0; padding:0 22px;
  position:relative; z-index:4;
}
.nb-strip{
  display:flex; align-items:center; gap:14px;
  background:linear-gradient(180deg, #fff 0%, rgba(255,255,255,0) 100%);
  border-radius:34px; padding:14px 16px;
}
.nb-arrow{
  flex:none; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
  background:var(--nb-teal); color:var(--nb-cream);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 22px -12px rgba(var(--nb-shadow),.55);
  transition:transform .28s var(--nb-ease), background .28s;
}
.nb-arrow:hover{ transform:scale(1.09); }
.nb-arrow:active{ transform:scale(.95); }
.nb-arrow svg{ width:19px; height:19px; }

.nb-track{
  flex:1; min-width:0; display:flex; justify-content:center; gap:16px;
  overflow-x:auto; scroll-behavior:smooth; scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch; padding:4px; scrollbar-width:none;
}
.nb-track::-webkit-scrollbar{ display:none; }

.nb-thumb{
  flex:none; width:96px; height:118px; border-radius:14px; padding:6px; cursor:pointer;
  scroll-snap-align:center; background:rgba(255, 255, 255, 0);
  border:2px solid transparent; opacity:.72;
  /* box-shadow:0 10px 20px -14px rgba(var(--nb-shadow),.5); */
  transition:transform .3s var(--nb-ease), border-color .3s, opacity .3s;
}
.nb-thumb img{ width:100%; height:100%; object-fit:contain; border-radius:9px; display:block; }
.nb-thumb:hover{ transform:translateY(-4px); opacity:1; }
.nb-thumb.active{
  border-color:#d9b7873f; opacity:1; transform:translateY(-5px) scale(1.06);
  box-shadow:0 16px 23px -18px rgba(var(--nb-shadow),.55);
  margin-bottom: 15px;
  margin-top: 5px;
}

/* ---------- detail : text right, oversized ring bleeding off the left ---------- */
.nb-detail{
  position:relative; z-index:2;
  max-width:var(--nb-maxw); margin:0 auto; padding:40px 22px 40px;
  display:grid; grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);
  /* align-items:center;  */
  gap:30px;
}
.nb-info{ min-width:0; }
.nb-category{
  display:inline-flex; align-items:center; gap:9px;
  background:var(--nb-teal-pale); color:var(--nb-teal);
  font-weight:700; font-size:.9rem; padding:9px 20px; border-radius:100px;
  margin-bottom:18px;
}
.nb-category::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--nb-gold); }
.nb-info h1{
  font-family:'Aref Ruqaa', serif; font-weight:700; color:var(--nb-teal);
  font-size:clamp(2.4rem, 5vw, 3.8rem); line-height:1.25; margin:0 0 22px;
}
.nb-info p{ color:var(--nb-ink-soft); font-size:1.06rem; line-height:1.95; max-width:600px; margin:0 0 14px; }
.nb-subhead{ font-weight:800; color:var(--nb-accent); font-size:1.08rem; margin:26px 0 14px !important; }
.nb-features{ display:flex; flex-direction:column; gap:12px; margin:0; padding:0; }
.nb-features li{
  list-style:none; color:var(--nb-ink-soft); font-size:1.02rem; line-height:1.8;
  position:relative; padding-inline-start:24px;
}
.nb-features li::before{
  content:""; position:absolute; inset-inline-start:0; top:11px;
  width:9px; height:9px; border-radius:50%; background:var(--nb-gold);
}

/* ===== the ring stage : huge, cropped by the page edge ===== */
.nb-stage{
  --size:clamp(440px, 52vw, 720px);   /* ring diameter          */
  --bleed:50%;                        /* how much runs off-page */
  --r:calc(var(--size) * .40);        /* orbit radius           */
  --base:0deg;                       /* resting spot on ring   */
  --a:0deg;                           /* live orbit offset      */
  position:relative; width:var(--size); aspect-ratio:1/1;
  justify-self:end;                              /* left column in RTL */
  margin-inline-end:calc(var(--bleed) * -1);     /* bleeds off the edge */
  margin-block:80px 30px;
}
.nb-ring{
  position:absolute; inset:0; border-radius:50%;
  background:
    radial-gradient(circle closest-side at 50% 50%,
      transparent 0 59.6%, var(--nb-teal) 60% 100%);
  box-shadow:0 40px 80px -40px rgba(var(--nb-shadow),.5);
  transform:rotate(var(--spin,0deg));
  transition:transform 1.3s var(--nb-ease);
}
/* dashed guide + gold beads so the rotation is readable */
.nb-ring::before{
  content:""; position:absolute; inset:12%; border-radius:50%;
  border:1.5px dashed rgba(255,255,255,.4);
}
.nb-ring::after{
  content:""; position:absolute; inset:0; border-radius:50%;
  background:
    radial-gradient(circle at 50% 2.6%,  var(--nb-gold) 0 5px, transparent 5.5px),
    radial-gradient(circle at 97.4% 50%, var(--nb-gold) 0 5px, transparent 5.5px),
    radial-gradient(circle at 50% 97.4%, var(--nb-gold) 0 5px, transparent 5.5px),
    radial-gradient(circle at 2.6% 50%,  var(--nb-gold) 0 5px, transparent 5.5px);
}
/* soft disc inside the ring so the cover has something to sit on */
.nb-disc{
  position:absolute; inset:20%; border-radius:50%;
  background:radial-gradient(circle at 34% 26%, var(--nb-paper) 0%, var(--nb-cream) 55%, var(--nb-blush) 100%);
  box-shadow:inset 0 12px 36px rgba(var(--nb-shadow),.08);
}

/* the cover rides ON the ring: rotate around the centre, then
   counter-rotate itself so it always stays upright */
.nb-orbit{
  position:absolute;
  top:50%;
  inset-inline-start:50%;
  width:0;
  height:0;
}

.nb-old-orbit{
  transform:rotate(var(--orbit, 0deg));
  transition:transform 1.3s var(--nb-ease);
  --orbit-angle: var(--orbit, 0deg);
}

.nb-new-orbit{
  transform:rotate(var(--entry, 0deg));
  transition:transform 1.3s var(--nb-ease);
  --orbit-angle: var(--entry, 0deg);
}
.nb-cover{
  position:absolute;
  top:0;
  left:0;
  width:clamp(150px, 50vw, 600px);

  transform:
    translate(-20%,-20%)
    translateY(calc(var(--r) * -1))
    rotate(calc((var(--base) + var(--orbit-angle, 0deg)) * -1));

  transition:
    transform 1.3s var(--nb-ease),
    opacity 1.3s var(--nb-ease);
}


.nb-cover img{
  width:100%;
  display:block;
  border-radius:13px;
  filter:drop-shadow(0 12px 18px rgba(var(--nb-shadow),.2));
}

.nb-old-cover,
.nb-new-cover{
  transition:opacity 1.3s var(--nb-ease);
}

.nb-old-orbit,
.nb-old-cover{
  transition:
    transform 1.3s var(--nb-ease),
    opacity 1.3s var(--nb-ease);
}

.nb-stage.no-anim .nb-orbit,
.nb-stage.no-anim .nb-cover{ transition:none !important; }

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .nb-detail{ grid-template-columns:1fr; justify-items:center; text-align:center; gap:30px; top:-110px; }
  .nb-stage{
    order:-1; --size:min(78vw, 440px); --bleed:0%;
    --r:0px; --base:0deg;
    margin-inline-end:0; justify-self:center;
  }
  .nb-cover{ width: clamp(88px, 80vw, 400px);
        left: -40px;
        top: -30px; 
        transform:
    translate(-50%,-50%)
    translateY(calc(var(--r) * -1))
    rotate(calc((var(--base) + var(--orbit-angle, 0deg)) * 1));
  }
          
  .nb-info p{ margin-inline:auto; }
  .nb-features{ align-items:flex-start; margin-inline:auto; width:fit-content; }
  .nb-features li{ text-align:start; }
}
@media (max-width:620px){
  .nb-topbar{ grid-template-columns:auto auto; row-gap:14px; }
  .nb-filter{ grid-column:1 / -1; order:3; width:100%; }
  .nb-strip-wrap{ padding:0 14px; }
  .nb-strip{ gap:8px; padding:8px 10px; border-radius:24px; }
  .nb-arrow{ width:34px; height:34px; }
  .nb-arrow svg{ width:15px; height:15px; }
  .nb-track{ justify-content:flex-start; gap:8px; padding:2px; }
  .nb-thumb{ width:58px; height:74px; border-radius:10px; padding:4px; }
}
@media (prefers-reduced-motion:reduce){
  .nb-ring, .nb-orbit, .nb-cover{ transition:none !important; }
}
</style>

    //   intro:'لتنظيم موادك ومحاضراتك وجدول مذاكرتك في مكان واحد أنيق وعملي.',
    //   features:[
    //     'جدول أسبوعي للمحاضرات والمذاكرة',
    //     'مساحة لتلخيص كل مادة على حدة',
    //     'متابعة الواجبات والاختبارات بمواعيدها'
    //   ]
    // },
    // {
    //   category:'other', categoryLabel:'تصاميم أخرى',
    //   title:'تصاميم أخرى', image:FALLBACK_IMG,
    //   intro:'دفاتر بتصاميم متنوعة لكل الأذواق، تجمع بين الجمال والعملية في كل صفحة.',
    //   features:[
    //     'تصاميم موسمية ومناسباتية محدودة',
    //     'أغلفة وأنماط داخلية متعددة للاختيار',
    //     'تُطبع حسب الطلب بجودة عالية'
    //   ]
    // }
  ];

  const trackEl        = document.getElementById('track');
  const filterBox      = document.getElementById('filterBox');
  const filterTrigger  = document.getElementById('filterTrigger');
  const filterLabel    = document.getElementById('filterLabel');
  const filterMenu     = document.getElementById('filterMenu');
  const detailCategory = document.getElementById('detailCategory');
  const detailTitle    = document.getElementById('detailTitle');
  const detailBody     = document.getElementById('detailBody');

  const stage    = document.getElementById('stage');
  const ring     = document.getElementById('ring');

  const oldOrbit = document.getElementById('oldOrbit');
  const newOrbit = document.getElementById('newOrbit');

  const oldCover = document.getElementById('oldCover');
  const newCover = document.getElementById('newCover');

  const oldImg = document.getElementById('oldImg');
  const newImg = document.getElementById('newImg');

  const SWING   = 88;   // how far along the ring the cover travels (deg)
  // const OUT_MS  = 800;  // travel-out duration (matches .nb-cover/.nb-orbit transition)
  // const IN_MS   = 800;  // travel-in duration (matches .nb-cover/.nb-orbit transition)
  const ANIM_MS = 1300;


  let currentList = [];
  let currentIndex = 0;
  let spin = 0;         // accumulated ring rotation
  let busy = false;
  let timers = [];

  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  let filterValue = 'all';

  function buildFilterOptions(){
    const seen = new Map();
    NOTEBOOKS.forEach(n => seen.set(n.category, n.categoryLabel));
    const opts = [['all', 'جميع الدفاتر']].concat([...seen.entries()]);

    filterMenu.innerHTML = opts.map(([v, l]) =>
      `<li role="option" data-value="${v}" aria-selected="${v === filterValue}" class="${v === filterValue ? 'selected' : ''}">${l}</li>`
    ).join('');

    const current = opts.find(([v]) => v === filterValue) || opts[0];
    filterLabel.textContent = current[1];

    filterMenu.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', () => {
        filterValue = li.dataset.value;
        filterLabel.textContent = li.textContent;
        filterMenu.querySelectorAll('li').forEach(o => {
          const isSel = o === li;
          o.classList.toggle('selected', isSel);
          o.setAttribute('aria-selected', String(isSel));
        });
        closeFilterMenu();
        applyFilter(filterValue);
      });
    });
  }

  function openFilterMenu(){
    filterMenu.classList.add('open');
    filterTrigger.setAttribute('aria-expanded', 'true');
    document.addEventListener('click', onFilterOutsideClick);
    document.addEventListener('keydown', onFilterKeydown);
  }
  function closeFilterMenu(){
    filterMenu.classList.remove('open');
    filterTrigger.setAttribute('aria-expanded', 'false');
    document.removeEventListener('click', onFilterOutsideClick);
    document.removeEventListener('keydown', onFilterKeydown);
  }
  function onFilterOutsideClick(e){
    if(!filterBox.contains(e.target)) closeFilterMenu();
  }
  function onFilterKeydown(e){
    if(e.key === 'Escape'){ closeFilterMenu(); filterTrigger.focus(); }
  }
  filterTrigger.addEventListener('click', () => {
    const isOpen = filterMenu.classList.contains('open');
    isOpen ? closeFilterMenu() : openFilterMenu();
  });

  function renderThumbnails(){
    trackEl.innerHTML = currentList.map((n,i) => `
      <button type="button" class="nb-thumb" data-index="${i}" aria-label="${n.title}">
        <img src="${n.image}" alt="${n.title}">
      </button>`).join('');
    trackEl.querySelectorAll('.nb-thumb').forEach(btn => {
      btn.addEventListener('click', () => selectNotebook(Number(btn.dataset.index)));
    });
  }

  function renderDetail(item){
    detailCategory.textContent = item.categoryLabel;
    detailTitle.textContent = item.title;

    const feats = (item.features && item.features.length)
      ? `<p class="nb-subhead">ماذا ستجد فيها؟</p>
        <ul class="nb-features">
          ${item.features.map(f => `<li>${f}</li>`).join('')}
        </ul>`
      : '';

    detailBody.innerHTML = `<p>${item.intro}</p>${feats}`;
  }

  function markActive(index){
    trackEl.querySelectorAll('.nb-thumb').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.index) === index);
    });
    const active = trackEl.querySelector('.nb-thumb.active');
    if(active) active.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  }

  /* the cover circulates WITH the ring: it slides along the ring's
     edge until it's gone, the ring keeps turning, then the next
     cover rides back in from the other side of the same circle. */
  function selectNotebook(index, opts){
    opts = opts || {};
    if(!currentList.length) return;

    index = ((index % currentList.length) + currentList.length) % currentList.length;

    const dir = opts.dir || 1;
    const item = currentList[index];

    currentIndex = index;
    markActive(index);

    // FIRST LOAD
    if(opts.animate === false){
      clearTimers();
      busy = false;

      stage.classList.add('no-anim');

      oldImg.src = item.image;
      oldImg.alt = item.title;

      oldOrbit.style.setProperty('--orbit', '0deg');
      oldCover.style.opacity = '1';

      newCover.style.opacity = '0';

      stage.style.setProperty('--a', '0deg');
      ring.style.setProperty('--spin', spin + 'deg');

      renderDetail(item);

      void stage.offsetWidth;
      stage.classList.remove('no-anim');

      return;
    }

    clearTimers();
    busy = true;

    // --------------------------------------------------
    // OLD COVER
    // --------------------------------------------------
    // The old cover is currently visible.
    // It will travel OUT with the ring.
    // --------------------------------------------------

    // Put the NEW cover at the opposite side BEFORE animation
    newImg.src = item.image;
    newImg.alt = item.title;

    stage.classList.add('no-anim');

    // New cover starts from opposite side
    newOrbit.style.setProperty('--entry', `${-SWING * dir}deg`);
    newCover.style.opacity = '0';

    void stage.offsetWidth;

    stage.classList.remove('no-anim');

    // --------------------------------------------------
    // BOTH START NOW
    // --------------------------------------------------

    // Ring rotates
    spin += 150 * dir;
    ring.style.setProperty('--spin', spin + 'deg');

    // OLD moves out
    oldOrbit.style.setProperty('--orbit', `${SWING * dir}deg`);
    oldCover.style.opacity = '0';

    // NEW moves in from opposite side
    newOrbit.style.setProperty('--entry', '0deg');
    newCover.style.opacity = '1';

    // Update text immediately
    renderDetail(item);

    // --------------------------------------------------
    // AFTER ANIMATION
    // --------------------------------------------------

    later(() => {

      // Old becomes the new current cover
      stage.classList.add('no-anim');

      oldImg.src = item.image;
      oldImg.alt = item.title;

      oldOrbit.style.setProperty('--orbit', '0deg');
      oldCover.style.opacity = '1';

      // Hide new temporarily
      newCover.style.opacity = '0';
      newOrbit.style.setProperty('--entry', `${-SWING * dir}deg`);

      void stage.offsetWidth;

      stage.classList.remove('no-anim');

    }, ANIM_MS);

    later(() => {
      busy = false;
    }, ANIM_MS + 50);
  }
  function step(delta){
    if(busy) return;
    selectNotebook(currentIndex + delta, { dir: delta > 0 ? 1 : -1 });
  }

  function applyFilter(catValue){
    currentList = catValue === 'all' ? NOTEBOOKS.slice() : NOTEBOOKS.filter(n => n.category === catValue);
    renderThumbnails();
    currentIndex = 0;
    selectNotebook(0, { animate:false });
  }

  document.getElementById('prevBtn').addEventListener('click', () => step(-1));
  document.getElementById('nextBtn').addEventListener('click', () => step(1));
  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight') step(-1);
    if(e.key === 'ArrowLeft')  step(1);
  });

  buildFilterOptions();
  applyFilter('all');
</script>
</body>
</html>
